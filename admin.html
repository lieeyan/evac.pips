<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | evac.pips</title>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem("evac-theme");
                if (theme) document.documentElement.setAttribute("data-theme", theme);
            } catch(e) {}
        })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="evac.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        .admin-section {
            margin-top: 100px;
            padding: 40px 20px 160px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 10;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-accent);
        }
        .admin-header h1 i { margin-right: 8px; }
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(128,128,128,0.1);
        }
        .stat-card .stat-num {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
        }
        .stat-card .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 4px;
        }
        .admin-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid rgba(128,128,128,0.1);
        }
        .admin-card h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }
        .admin-card h2 i { margin-right: 8px; }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .admin-table th {
            font-weight: 700;
            color: var(--primary-accent);
            padding: 12px 14px;
            border-bottom: 2px solid rgba(128,128,128,0.2);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(128,128,128,0.08);
            font-size: 0.95rem;
            vertical-align: middle;
        }
        .admin-table tbody tr:hover {
            background: rgba(2,132,199,0.04);
        }
        .remove-btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .remove-btn:hover {
            background: #ef4444;
            color: white;
        }
        .clear-btn {
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            background: transparent;
            color: #ef4444;
            border: 2px solid #ef4444;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            float: right;
            margin-top: -40px;
        }
        .clear-btn:hover {
            background: #ef4444;
            color: white;
        }
        .empty-msg {
            text-align: center;
            padding: 30px;
            opacity: 0.5;
            font-size: 0.95rem;
        }
        .user-search { position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
        .user-search-field { position: relative; flex: 1 1 260px; max-width: 420px; }
        .user-search-field i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
        .user-search-field input {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px 10px 40px;
            font: inherit;
            font-size: .95rem;
            color: var(--text-color);
            background: var(--seg-hover);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            outline: none;
            transition: border-color .2s;
        }
        .user-search-field input:focus { border-color: var(--primary-accent); }
        .user-search-count { font-size: .88rem; opacity: .75; }
        .user-empty td { text-align: center; padding: 22px 12px; opacity: .7; }
        .facility-group {
            margin-bottom: 30px;
        }
        .facility-group h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .facility-group h3 .badge {
            font-size: 0.75rem;
        }
        .access-denied {
            text-align: center;
            padding: 60px 20px;
        }
        .access-denied h2 { color: #ef4444; margin-bottom: 10px; }
        .access-denied a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 30px;
            background: var(--primary-accent);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
        }
        @media (max-width: 700px) {
            .admin-table { font-size: 0.85rem; }
            .admin-table th, .admin-table td { padding: 8px 6px; }
            .clear-btn { float: none; margin: 10px 0; }
            .admin-table thead {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
            }
            .admin-table, .admin-table tbody, .admin-table tr, .admin-table td { display: block; width: 100%; }
            .admin-table tr { padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.2); }
            .admin-table tbody tr:last-child { border-bottom: none; }
            .admin-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 14px;
                padding: 6px 4px;
                border-bottom: none;
                text-align: right;
            }
            .admin-table td::before {
                content: attr(data-label);
                flex: 0 0 42%;
                text-align: left;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: var(--primary-accent);
            }
        }

        .fl-hint { opacity: 0.75; font-size: 0.92rem; margin: 6px 0 16px; }
        .fl-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .fl-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            min-height: 38px;
            border-radius: 999px;
            border: 1px solid rgba(128,128,128,0.3);
            background: transparent;
            color: var(--text-color);
            font: inherit;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .fl-chip:hover { background: var(--seg-hover); }
        .fl-chip.on { background: var(--seg-active-bg); color: var(--seg-active-text); border-color: transparent; }
        .fl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .fl-dot.high { background: #ef4444; }
        .fl-dot.moderate { background: #f59e0b; }
        .fl-dot.low { background: #10b981; }
        .fl-panel { border: 1px solid rgba(128,128,128,0.2); border-radius: 14px; padding: 18px; }
        .fl-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .fl-title h3 { font-size: 1.15rem; font-weight: 700; margin: 0 0 8px; }
        .fl-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .fl-families { font-size: 0.88rem; opacity: 0.8; margin-left: 4px; }
        .fl-meta { font-size: 0.82rem; opacity: 0.65; margin-top: 8px; }
        .fl-cap {
            display: block;
            margin-bottom: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--primary-accent);
        }
        .fl-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--seg-hover); }
        .fl-seg button {
            border: none;
            background: transparent;
            color: var(--text-color);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 14px;
            min-height: 36px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .fl-seg button:hover { background: rgba(128,128,128,0.15); }
        .fl-seg button.on { color: #ffffff; }
        .fl-seg button.low.on { background: #10b981; }
        .fl-seg button.moderate.on { background: #f59e0b; }
        .fl-seg button.high.on { background: #ef4444; }
        .fl-seg button.a1.on { background: #047857; }
        .fl-seg button.a2.on { background: #b45309; }
        .fl-seg button.a3.on { background: #b91c1c; }
        .fl-bulkrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 6px; }
        .fl-bulkrow .fl-cap { margin: 0; }
        .fl-bulk { display: flex; gap: 8px; flex-wrap: wrap; }
        .fl-bulk-btn {
            border: 1px solid rgba(128,128,128,0.3);
            background: transparent;
            color: var(--text-color);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 7px 14px;
            min-height: 36px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .fl-bulk-btn:hover { color: #ffffff; border-color: transparent; }
        .fl-bulk-btn.low:hover { background: #10b981; }
        .fl-bulk-btn.moderate:hover { background: #f59e0b; }
        .fl-bulk-btn.high:hover { background: #ef4444; }
        .fl-head, .fl-row {
            display: grid;
            grid-template-columns: minmax(110px, 1fr) 222px 130px minmax(190px, 1.2fr);
            gap: 12px 18px;
            align-items: center;
        }
        .fl-head {
            margin-top: 14px;
            padding: 8px 0;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--primary-accent);
            border-bottom: 1px solid rgba(128,128,128,0.2);
        }
        .fl-row { padding: 12px 0; border-bottom: 1px solid rgba(128,128,128,0.15); }
        .fl-row:last-child { border-bottom: none; }
        .fl-name { font-weight: 700; }
        .fl-cell .fl-cap { display: none; }
        .fl-cell input, .fl-cell select {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(128,128,128,0.3);
            background: var(--bg-color);
            color: var(--text-color);
            font: inherit;
            font-size: 0.95rem;
        }
        [data-theme="dark"] .fl-cell input, [data-theme="dark"] .fl-cell select { color-scheme: dark; }
        .fl-cell input:focus, .fl-cell select:focus { outline: none; border-color: var(--primary-accent); }
        .fl-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .fl-reset {
            border: 1px solid rgba(239,68,68,0.5);
            background: transparent;
            color: #ef4444;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 16px;
            min-height: 38px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .fl-reset:hover { background: #ef4444; color: #ffffff; }
        .fl-saved { font-size: 0.85rem; opacity: 0.6; }
        .fl-saved.ok { color: #10b981; opacity: 1; }
        .fl-saved.bad { color: #ef4444; opacity: 1; }
        @media (max-width: 760px) {
            .fl-head { display: none; }
            .fl-panel { padding: 14px; }
            .fl-row { grid-template-columns: 1fr 1fr; gap: 10px 12px; padding: 14px 0; }
            .fl-name { grid-column: 1 / -1; font-size: 1.02rem; }
            .fl-level { grid-column: 1 / -1; }
            .fl-cell .fl-cap { display: block; }
            .fl-alert { width: 100%; }
            .fl-level .fl-seg, .fl-alert .fl-seg { display: flex; width: 100%; }
            .fl-level .fl-seg button, .fl-alert .fl-seg button { flex: 1; padding: 8px 6px; white-space: nowrap; }
            .fl-bulk { width: 100%; }
            .fl-bulk-btn { flex: 1; }
        }
        @media (max-width: 420px) {
            .fl-row { grid-template-columns: 1fr; }
        }
    </style>

    <script src="navigation.js"></script>
</head>
<body>
    <div class="mesh-bg"></div>

    <nav class="navbar">
        <div class="logo-container">
            <div class="logo">evac.pips</div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        <ul class="nav-links">

        </ul>

    <section class="admin-section" id="admin-content">

    </section>

    <div class="fixed-waves">
        <svg viewBox="0 0 120 28" preserveAspectRatio="none">
            <defs><path id="wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
            <g class="wave-group">
                <use href="#wave" x="48" y="0" fill="rgba(2, 132, 199, 0.3)" />
                <use href="#wave" x="48" y="3" fill="rgba(2, 132, 199, 0.5)" />
                <use href="#wave" x="48" y="5" fill="rgba(2, 132, 199, 0.7)" />

            </g>
        </svg>

    <div id="fade-overlay" class="fade-overlay"></div>

    <script src="auth.js"></script>
    <script src="seed.js"></script>
    <script src="evac.js"></script>
    <script src="app.js"></script>
    <script src="flood-data.js"></script>
    <script src="flood-admin.js"></script>
    <script src="admin-accounts.js"></script>
    <script>
    let userQuery = "";

    function applyUserFilter() {
        const terms = userQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
        const rows = document.querySelectorAll("#admin-content tr[data-search]");
        let shown = 0;
        rows.forEach(row => {
            const match = terms.every(t => row.dataset.search.includes(t));
            row.hidden = !match;
            if (match) shown++;
        });
        const empty = document.getElementById("user-empty");
        if (empty) empty.hidden = shown > 0 || rows.length === 0;
        const count = document.getElementById("user-search-count");
        if (count) count.textContent = terms.length ? `Showing ${shown} of ${rows.length}` : "";
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("admin-content").addEventListener("input", event => {
            if (event.target.id !== "user-search") return;
            userQuery = event.target.value;
            applyUserFilter();
        });
        renderAdmin();
        window.addEventListener("storage", (e) => {
            if (!e.key || ["evac-records", "evac-users", "evac-session"].includes(e.key)) renderAdmin();
        });
        window.addEventListener("evac:change", renderAdmin);
        window.addEventListener("pageshow", renderAdmin);
    });

    function renderAdmin() {
        const container = document.getElementById("admin-content");
        if (!EvacAuth.isAdmin()) {
            container.innerHTML = `<div class="admin-card"><div class="access-denied">
                <h2><i class="fas fa-lock"></i> Access Denied</h2>
                <p>You must be logged in as an administrator to view this page.</p>
                <a href="login.html"><i class="fas fa-right-to-bracket"></i> Go to Login</a>
            </div></div>`;
            return;
        }
        const records = EvacAuth.getAllRecords();
        const users = EvacAuth.getAllUsers();

        const totalFamilies = records.length;
        const totalPersons = records.reduce((s, r) => s + Number(r.familyMembers || 0), 0);
        const facilities = [...new Set(records.map(r => r.facilityId))];

        const byFacility = {};
        records.forEach(r => {
            if (!byFacility[r.facilityId]) {
                byFacility[r.facilityId] = { name: r.facilityName, area: r.areaSlug, records: [] };
            }
            byFacility[r.facilityId].records.push(r);
        });

        let html = `
            <div class="admin-header">
                <h1><i class="fas fa-shield-halved"></i> Admin Panel</h1>
                <span style="opacity:0.7;">Logged in as <strong>${esc(EvacAuth.currentUser().username)}</strong> &nbsp;|&nbsp;
                    <a href="login.html" data-logout id="admin-logout" style="color:#ef4444;font-weight:600;"><i class="fas fa-arrow-right-from-bracket"></i> Logout</a>
                </span>
            </div>

            <div class="stat-cards">
                <div class="stat-card">
                    <div class="stat-num">${users.length}</div>
                    <div class="stat-label"><i class="fas fa-users"></i> Registered Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">${totalFamilies}</div>
                    <div class="stat-label"><i class="fas fa-house-chimney"></i> Evacuated Families</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">${totalPersons}</div>
                    <div class="stat-label"><i class="fas fa-people-group"></i> Total Persons</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">${facilities.length}</div>
                    <div class="stat-label"><i class="fas fa-building-shield"></i> Active Facilities</div>
                </div>
            </div>
            <div id="flood-slot"></div>`;

        html += `
            <div class="admin-card">
                <p id="account-notice" class="account-notice" role="status" hidden></p>
                <h2><i class="fas fa-address-book"></i> Registered Users (${users.length})</h2>
                <div class="user-search">
                    <div class="user-search-field">
                        <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="user-search" placeholder="Search by name or username" value="${esc(userQuery)}" autocomplete="off" spellcheck="false" aria-label="Search registered users by name or username">
                    </div>
                    <span class="user-search-count" id="user-search-count" role="status" aria-live="polite"></span>
                </div>
                <div style="overflow-x:auto;">
                <table class="admin-table">
                    <thead><tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Family Members</th>
                        <th>Municipality</th>
                        <th>Status</th>
                        <th>Account</th>
                    </tr></thead>
                    <tbody>`;

        users.forEach(u => {
            const rec = records.find(r => r.username === u.username);
            const status = rec
                ? `<span class="badge" style="background:#b45309;">At ${esc(rec.facilityName)}</span>`
                : `<span class="badge" style="background:#6b7280;">Not Evacuated</span>`;
            html += `<tr data-search="${esc(((u.fullName || "") + " " + u.username + " " + (u.municipality || "")).toLowerCase())}">
                <td data-label="Username"><strong>${esc(u.username)}</strong></td>
                <td data-label="Full Name">${esc(u.fullName)}</td>
                <td data-label="Family Members" style="text-align:center;font-weight:700;">${Number(u.familyMembers || 1)}</td>
                <td data-label="Municipality">${esc(u.municipality || "—")}</td>
                <td data-label="Status">${status}</td>
                <td data-label="Account"><button type="button" class="edit-user-btn" data-username="${esc(u.username)}" aria-label="Edit account for ${esc(u.username)}"><i class="fas fa-pen" aria-hidden="true"></i> Edit</button></td>
            </tr>`;
        });

        html += `<tr class="user-empty" id="user-empty" hidden><td colspan="6">No accounts match your search.</td></tr>`;
        html += `</tbody></table></div></div>`;

        html += `<div class="admin-card">
            <h2><i class="fas fa-building-shield"></i> Evacuation Records by Facility</h2>`;

        if (Object.keys(byFacility).length === 0) {
            html += `<div class="empty-msg"><i class="fas fa-inbox"></i> No evacuation records yet.</div>`;
        } else {
            for (const [facId, fac] of Object.entries(byFacility)) {
                const facFamilies = fac.records.length;
                const facPersons = fac.records.reduce((s, r) => s + Number(r.familyMembers || 0), 0);
                html += `
                    <div class="facility-group">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
                            <h3 style="margin:0;">
                                <i class="fas fa-building" style="color:var(--primary-accent);"></i>
                                ${esc(fac.name)}
                                <span class="badge open">${esc(fac.area)}</span>
                                <span style="font-weight:400;font-size:0.9rem;opacity:0.75;">
                                    — ${facFamilies} families, ${facPersons} persons
                                </span>
                            </h3>
                            <button class="clear-btn" data-facility="${esc(facId)}" title="Remove all evacuees from this facility">
                                <i class="fas fa-trash"></i> Clear Facility
                            </button>
                        </div>
                        <div style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead><tr>
                                <th>Family Head</th>
                                <th>Username</th>
                                <th>Members</th>
                                <th>Evacuated At</th>
                                <th>Action</th>
                            </tr></thead>
                            <tbody>`;
                fac.records.forEach(r => {
                    const dt = new Date(r.timestamp);
                    const dateStr = dt.toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" })
                        + " " + dt.toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" });
                    html += `<tr>
                        <td data-label="Family Head"><strong>${esc(r.fullName)}</strong></td>
                        <td data-label="Username">${esc(r.username)}</td>
                        <td data-label="Members" style="text-align:center;font-weight:700;">${Number(r.familyMembers || 1)}</td>
                        <td data-label="Evacuated At">${dateStr}</td>
                        <td data-label="Action"><button class="remove-btn" data-username="${esc(r.username)}" data-facility="${esc(facId)}">
                            <i class="fas fa-xmark"></i> Remove
                        </button></td>
                    </tr>`;
                });
                html += `</tbody></table></div></div>`;
            }
        }

        html += `</div>`;
        const searchBox = document.getElementById("user-search");
        const keepFocus = !!searchBox && document.activeElement === searchBox;
        const caret = keepFocus ? [searchBox.selectionStart, searchBox.selectionEnd] : null;
        container.innerHTML = html;
        applyUserFilter();
        if (keepFocus) {
            const box = document.getElementById("user-search");
            box.focus();
            try { box.setSelectionRange(caret[0], caret[1]); } catch (_) {}
        }
        if (typeof mountFloodControl === "function") mountFloodControl();

        container.querySelectorAll(".clear-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const facilityId = btn.getAttribute("data-facility");
                if (!confirm("Remove ALL evacuees from this facility?")) return;
                EvacAuth.adminClearFacility(facilityId);
                renderAdmin();
            });
        });

        container.querySelectorAll(".remove-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const username = btn.getAttribute("data-username");
                const facilityId = btn.getAttribute("data-facility");
                if (!confirm(`Remove ${username} from this facility?`)) return;
                EvacAuth.adminRemoveRecord(username, facilityId);
                renderAdmin();
            });
        });

    }

    function esc(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
    </script>
</body>
</html>
